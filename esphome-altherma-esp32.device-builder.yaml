esphome:
  name: esphome-altherma
  friendly_name: ESPHome Altherma
  name_add_mac_suffix: false
  project:
      name: rsre.esphome-altherma
      version: 0.0.18

# Enable logging
logger:

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable ESPHome API
api:
  encryption:
    key: !secret ha_api_key
  custom_services: true

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Altherma Fallback Hotspot"
    password: !secret hotspot_password

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device.
captive_portal:

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1

external_components:
  - source: github://rsre/esphome-altherma@main
    components: [altherma_hub]

altherma_hub:
  id: altherma_hub_1
  uart_id: uart_bus
  update_interval: 30s
  query_result_text_sensor: query_registry_result

text_sensor:
  - platform: template
    name: "Manual Query Registry Result"
    id: query_registry_result
    entity_category: diagnostic

packages:
  altherma_sensors: github://rsre/esphome-altherma/confs/epga_ea_dj_11_16.yaml@main
